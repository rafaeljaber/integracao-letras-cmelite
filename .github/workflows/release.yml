name: Release

# Dispara ao enviar uma tag vX.Y.Z (a versão precisa bater com package.json).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci

      - name: Tag confere com a versão do projeto
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME não bate com package.json ($VERSION)" >&2
            exit 1
          fi

      - run: npm run typecheck
      - run: bun test

      - name: Plugin (zip)
        run: npm run package

      - name: Ponte (executáveis macOS e Windows)
        run: npm run bridge:build

      - name: Empacota a ponte com licenças e gera as somas
        working-directory: release
        run: |
          for bin in ponte-cmelite-macos-arm64 ponte-cmelite-macos-x64 ponte-cmelite-windows-x64.exe; do
            chmod +x "$bin"
            zip -j "${bin%.exe}.zip" "$bin" ../LICENSE ../THIRD_PARTY_NOTICES.md
            rm "$bin"
          done
          sha256sum *.zip > SHA256SUMS.txt
          ls -la

      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in v0.*|*-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/*.zip release/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" --generate-notes $PRERELEASE
